spring.application.name=delivery
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# spring.datasource.url=jdbc:postgresql://pg:5432/studs
# spring.datasource.username=s469869
# spring.datasource.password=WZhWioHFnztMlImD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate JTA configuration
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossStandAloneJtaPlatform
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_HOLD
spring.jpa.properties.hibernate.current_session_context_class=jta

# Narayana JTA configuration
spring.jta.transaction-manager-id=1
spring.jta.log-dir=target/transaction-logs

# spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=UTC

server.port=32318

# Messaging (Apache ActiveMQ Artemis as broker, AMQP 1.0 transport via Qpid JMS)
app.messaging.amqp.url=amqp://localhost:5672
app.messaging.amqp.username=admin
app.messaging.amqp.password=admin

# Optional embedded broker (disabled by default; prefer running a separate broker for multi-node mode)
app.messaging.embedded.enabled=false
app.messaging.embedded.amqp-port=5672

# Turn off JMS listeners on API-only nodes via a profile if needed
app.features.jms-listeners=true
app.features.listener.courier-assignment=true
app.features.listener.notification-dispatch=true
app.features.listener.external-logistics=true

# Quartz Scheduler configuration (JDBC-backed for cluster mode)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=DeliveryScheduler
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=false
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.jobStore.txIsolationLevelSerializable=true
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.sql.init.schema-locations=classpath:quartz-schema.sql
spring.sql.init.mode=always

# Disable Spring's @Scheduled since we use Quartz now
spring.task.scheduling.pool.size=0

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

app.jwt.secret=delivery-service-jwt-secret-key-very-long-and-secure-1234567890
app.jwt.expiration-ms=86400000
