spring.application.name=delivery
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossStandAloneJtaPlatform
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_HOLD
spring.jpa.properties.hibernate.current_session_context_class=jta

app.camunda.webapp-url=${CAMUNDA_WEBAPP_URL:http://localhost:8080/camunda}
app.camunda.rest-url=${CAMUNDA_REST_URL:http://localhost:8080/engine-rest}
app.camunda.username=${CAMUNDA_SERVICE_USERNAME:admin}
app.camunda.password=${CAMUNDA_SERVICE_PASSWORD:admin123}
app.camunda.external-tasks.worker-id=${CAMUNDA_EXTERNAL_TASK_WORKER_ID:delivery-api}
app.camunda.external-tasks.lock-duration-ms=60000
app.camunda.external-tasks.async-response-timeout-ms=20000
app.camunda.external-tasks.retry-timeout-ms=15000
app.camunda.order-start-timeout-ms=15000

spring.jta.transaction-manager-id=1
spring.jta.log-dir=target/transaction-logs

# spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=UTC

server.port=32318

app.messaging.amqp.url=amqp://localhost:5672
app.messaging.amqp.username=admin
app.messaging.amqp.password=admin

app.features.jms-listeners=true
app.features.listener.courier-assignment=true
app.features.listener.notification-dispatch=true
app.features.listener.bitrix-order-sync=true
app.features.listener.process-correlation=true

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=DeliveryScheduler
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

spring.task.scheduling.pool.size=0

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

app.jwt.secret=delivery-service-jwt-secret-key-very-long-and-secure-1234567890
app.jwt.expiration-ms=86400000
app.security.users-xml=${DELIVERY_USERS_XML:}

app.eis.bitrix24.connection-factory-jndi-name=java:/eis/Bitrix24ConnectionFactory
app.eis.bitrix24.stage.pending-shop=C1:NEW
app.eis.bitrix24.stage.accepted-waiting-courier=C1:PREPARATION
app.eis.bitrix24.stage.courier-assigned=C1:WON
app.eis.bitrix24.stage.declined-by-shop=C1:LOSE
app.eis.bitrix24.stage.cancelled-no-courier=C1:APOLOGY
