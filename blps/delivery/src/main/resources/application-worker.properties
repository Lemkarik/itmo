spring.main.web-application-type=none

app.features.jms-listeners=true
app.features.listener.courier-assignment=true
app.features.listener.notification-dispatch=true
app.features.listener.bitrix-order-sync=false
spring.quartz.auto-startup=true

spring.jta.transaction-manager-id=${DELIVERY_WORKER_TRANSACTION_MANAGER_ID:delivery-worker-1}
spring.jta.log-dir=${DELIVERY_WORKER_TRANSACTION_LOG_DIR:target/transaction-logs/worker}
