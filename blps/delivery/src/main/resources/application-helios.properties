# WildFly profile: use the application-server-managed Narayana transaction manager and datasource.
# The datasource must be configured in WildFly before deploying the WAR.
spring.datasource.jndi-name=java:/jboss/datasources/DeliveryDS
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossAppServerJtaPlatform
spring.jta.enabled=true
spring.jta.log-dir=

# In production, pass these secrets as WildFly system properties or environment variables.
app.jwt.secret=${DELIVERY_JWT_SECRET}
app.messaging.amqp.url=${DELIVERY_AMQP_URL}
app.messaging.amqp.username=${DELIVERY_AMQP_USERNAME}
app.messaging.amqp.password=${DELIVERY_AMQP_PASSWORD}
app.camunda.webapp-url=${CAMUNDA_WEBAPP_URL:http://localhost:8080/camunda}
app.camunda.rest-url=${CAMUNDA_REST_URL:http://localhost:8080/engine-rest}
app.camunda.username=${CAMUNDA_SERVICE_USERNAME:admin}
app.camunda.password=${CAMUNDA_SERVICE_PASSWORD:admin123}
