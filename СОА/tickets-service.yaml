openapi: 3.0.4
info:
  title: Ticket Collection API
  version: 1.0.0
  description: |
    REST API for managing a ticket collection.

servers:
  - url: https://localhost:32318/api
tags:
  - name: Tickets
    description: Basic operations on the Ticket collection
  - name: Ticket operations
    description: Additional collection operations

paths:
  /tickets:
    get:
      tags: [Tickets]
      summary: Get tickets
      description: |
        Returns a page of tickets. Any filters may be combined; multiple `sort`
        parameters define the sorting sequence. The sort format is
        `field,direction`, for example `price,desc`.
      operationId: getTickets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/FilterId'
        - $ref: '#/components/parameters/FilterName'
        - $ref: '#/components/parameters/FilterCoordinatesX'
        - $ref: '#/components/parameters/FilterCoordinatesY'
        - $ref: '#/components/parameters/FilterCreationDate'
        - $ref: '#/components/parameters/FilterPrice'
        - $ref: '#/components/parameters/FilterComment'
        - $ref: '#/components/parameters/FilterRefundable'
        - $ref: '#/components/parameters/FilterType'
        - $ref: '#/components/parameters/FilterPersonWeight'
        - $ref: '#/components/parameters/FilterPersonHairColor'
        - $ref: '#/components/parameters/FilterLocationX'
        - $ref: '#/components/parameters/FilterLocationY'
        - $ref: '#/components/parameters/FilterLocationZ'
      responses:
        '200':
          description: Ticket page generated successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tickets]
      summary: Create a ticket
      description: |
        Adds a ticket to the collection. `id` and `creationDate` are generated by the server.
      operationId: createTicket
      requestBody:
        required: true
        description: New ticket data in XML format
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: Ticket created
          headers:
            Location:
              description: URL of the created ticket
              schema:
                type: string
                format: uri
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Get a ticket by ID
      description: Returns the ticket with the specified automatically generated identifier.
      operationId: getTicketById
      responses:
        '200':
          description: Ticket found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Tickets]
      summary: Update a ticket
      description: |
        Fully replaces the ticket's mutable fields. The `id` and `creationDate`
        values are preserved and are not accepted in the input XML.
      operationId: updateTicket
      requestBody:
        required: true
        description: New state of the ticket's mutable fields
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '200':
          description: Ticket updated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tickets]
      summary: Delete a ticket
      description: Deletes the ticket with the specified identifier from the collection.
      operationId: deleteTicket
      responses:
        '204':
          description: Ticket deleted; response body is empty
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/type/{type}:
    delete:
      tags: [Ticket operations]
      summary: Delete all tickets of a specified type
      description: Deletes every ticket whose `type` field equals the value in the URL.
      operationId: deleteTicketsByType
      parameters:
        - name: type
          in: path
          required: true
          description: Type of tickets to delete
          schema:
            $ref: '#/components/schemas/TicketType'
      responses:
        '200':
          description: Operation completed; returns the number of deleted tickets
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/comment:
    delete:
      tags: [Ticket operations]
      summary: Delete one ticket with a specified comment
      description: |
        Deletes any one ticket whose `comment` field exactly matches the query
        parameter. If several tickets match, the chosen ticket is unspecified.
      operationId: deleteOneTicketByComment
      parameters:
        - name: comment
          in: query
          required: true
          allowEmptyValue: true
          description: Comment of the ticket to delete; it must be URL-encoded
          schema:
            type: string
      responses:
        '204':
          description: One matching ticket deleted; response body is empty
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/price/sum:
    get:
      tags: [Ticket operations]
      summary: Calculate the sum of all ticket prices
      description: Returns the sum of the `price` field for all collection objects; returns 0 for an empty collection.
      operationId: getTicketPriceSum
      responses:
        '200':
          description: Sum calculated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PriceSum'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: Positive ticket identifier
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: Page number, starting from 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: |
        Sorting criteria in `field,asc` or `field,desc` format.
        Repeat the parameter to sort by multiple fields.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(id|name|coordinates\.x|coordinates\.y|creationDate|price|comment|refundable|type|person\.weight|person\.hairColor|person\.location\.x|person\.location\.y|person\.location\.z),(asc|desc)$'
      example: ['price,desc', 'name,asc']
    FilterId:
      name: id
      in: query
      description: Filter by identifier
      schema: {type: integer, format: int64, minimum: 1}
    FilterName:
      name: name
      in: query
      description: Filter by exact name
      schema: {type: string, minLength: 1}
    FilterCoordinatesX:
      name: coordinates.x
      in: query
      description: Filter by x coordinate
      schema: {type: integer, format: int64}
    FilterCoordinatesY:
      name: coordinates.y
      in: query
      description: Filter by y coordinate
      schema: {type: integer, format: int32}
    FilterCreationDate:
      name: creationDate
      in: query
      description: Filter by creation date and time
      schema: {type: string, format: date-time}
    FilterPrice:
      name: price
      in: query
      description: Filter by price
      schema: {type: integer, format: int32, minimum: 1}
    FilterComment:
      name: comment
      in: query
      allowEmptyValue: true
      description: Filter by exact comment
      schema: {type: string}
    FilterRefundable:
      name: refundable
      in: query
      description: Filter by refundability flag
      schema: {type: boolean}
    FilterType:
      name: type
      in: query
      description: Filter by ticket type
      schema:
        $ref: '#/components/schemas/TicketType'
    FilterPersonWeight:
      name: person.weight
      in: query
      description: Filter by ticket holder weight
      schema: {type: integer, format: int32, minimum: 1}
    FilterPersonHairColor:
      name: person.hairColor
      in: query
      description: Filter by ticket holder hair color
      schema:
        $ref: '#/components/schemas/Color'
    FilterLocationX:
      name: person.location.x
      in: query
      description: Filter by ticket holder location x coordinate
      schema: {type: number, format: float}
    FilterLocationY:
      name: person.location.y
      in: query
      description: Filter by ticket holder location y coordinate
      schema: {type: number, format: float}
    FilterLocationZ:
      name: person.location.z
      in: query
      description: Filter by ticket holder location z coordinate
      schema: {type: integer, format: int64}

  responses:
    BadRequest:
      description: URL, query parameters, or XML have invalid syntax
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            message: Invalid request parameters or malformed XML
            timestamp: '2026-10-16T12:00:00Z'
    NotFound:
      description: Requested resource was not found
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            message: Ticket not found
            timestamp: '2026-10-16T12:00:00Z'
    UnsupportedMediaType:
      description: Content-Type application/xml is required
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 415
            message: Content-Type must be application/xml
            timestamp: '2026-10-16T12:00:00Z'
    ValidationError:
      description: Data violates model integrity constraints
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            status: 422
            message: Ticket data violates integrity constraints
            timestamp: '2026-10-16T12:00:00Z'
            violations:
              - field: price
                message: must be greater than 0
    InternalError:
      description: Internal service error
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 500
            message: Internal service error
            timestamp: '2026-10-16T12:00:00Z'

  schemas:
    Ticket:
      type: object
      xml:
        name: ticket
      required: [id, name, coordinates, creationDate, price, comment, refundable]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Unique identifier generated automatically by the server
        name:
          type: string
          minLength: 1
          description: Non-empty ticket name
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          readOnly: true
          description: Creation date generated automatically by the server
        price:
          type: integer
          format: int32
          minimum: 1
          description: Positive ticket price
        comment:
          type: string
          description: Required comment; an empty string is allowed
        refundable:
          type: boolean
          description: Whether the ticket can be refunded
        type:
          $ref: '#/components/schemas/TicketType'
        person:
          $ref: '#/components/schemas/Person'
    TicketInput:
      type: object
      xml:
        name: ticket
      required: [name, coordinates, price, comment, refundable]
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        price:
          type: integer
          format: int32
          minimum: 1
        comment:
          type: string
        refundable:
          type: boolean
        type:
          $ref: '#/components/schemas/TicketType'
        person:
          $ref: '#/components/schemas/Person'
      example:
        name: Concert ticket
        coordinates: {x: 120, y: 45}
        price: 3500
        comment: Stalls, row 3
        refundable: true
        type: VIP
        person:
          weight: 75
          hairColor: BLACK
          location: {x: 59.94, y: 30.31, z: 10}
    Coordinates:
      type: object
      xml:
        name: coordinates
      required: [x, y]
      properties:
        x:
          type: integer
          format: int64
        y:
          type: integer
          format: int32
    Person:
      type: object
      xml:
        name: person
      required: [location]
      properties:
        weight:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        hairColor:
          allOf:
            - $ref: '#/components/schemas/Color'
          nullable: true
        location:
          $ref: '#/components/schemas/Location'
    Location:
      type: object
      xml:
        name: location
      required: [x, y, z]
      properties:
        x:
          type: number
          format: float
        y:
          type: number
          format: float
        z:
          type: integer
          format: int64
    TicketType:
      type: string
      nullable: true
      enum: [VIP, BUDGETARY, CHEAP]
      description: Ticket type
    Color:
      type: string
      nullable: true
      enum: [BLACK, YELLOW, WHITE]
      description: Hair color
    TicketPage:
      type: object
      xml:
        name: ticketPage
      required: [tickets, page, pageSize, totalElements, totalPages]
      properties:
        tickets:
          type: array
          xml:
            name: tickets
            wrapped: true
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PriceSum:
      type: object
      xml:
        name: priceSum
      required: [value]
      properties:
        value:
          type: integer
          format: int64
          minimum: 0
          description: Sum of the prices of all tickets
    DeleteResult:
      type: object
      xml:
        name: deleteResult
      required: [deletedCount]
      properties:
        deletedCount:
          type: integer
          format: int64
          minimum: 0
    Error:
      type: object
      xml:
        name: error
      required: [status, message, timestamp]
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          xml:
            name: validationError
          properties:
            violations:
              type: array
              xml:
                name: violations
                wrapped: true
              items:
                $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      xml:
        name: violation
      required: [field, message]
      properties:
        field:
          type: string
          example: price
        message:
          type: string
          example: must be greater than 0
